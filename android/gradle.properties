org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Directory where Skia was compiled for Android (out/Android-arm64 and
# out/Android-x64 sub-directories are expected). See android/README.md
aseprite.skiaDir=C:/deps/skia

# Path to the "gen" tool compiled for the host machine (it's used to
# generate C++ code from XML files during the build). See android/README.md
aseprite.genExe=C:/deps/build-gen-host/bin/gen.exe

# ABIs to compile (comma separated)
aseprite.abis=arm64-v8a,x86_64
